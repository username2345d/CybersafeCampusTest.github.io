<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberSafe Campus</title>
  <meta name="description" content="CyberSafe Campus: recurso educativo interactivo y bilingüe sobre ciberseguridad para estudiantes universitarios.">

  <!-- Ícono de la pestaña: escudo con candado (SVG incrustado) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 6v9c0 7.5 5 13 12 15 7-2 12-7.5 12-15V6z' fill='%230C4966'/%3E%3Crect x='11' y='14' width='10' height='8' rx='1.5' fill='%23F4AF00'/%3E%3Cpath d='M13 14v-2.5a3 3 0 0 1 6 0V14' fill='none' stroke='%23E67016' stroke-width='2'/%3E%3C/svg%3E">

  <!-- Estilos: paleta UNAD, layout, menú y actividades -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Bloque fijo superior: bandera, encabezado, menú y progreso -->
  <div class="top">

    <!-- Bandera UNAD: franjas azul, naranja y amarillo -->
    <div class="flag"><i></i><i></i><i></i></div>

    <!-- Encabezado: logo con nombre del proyecto (vuelve al inicio) y botón de idioma ES/EN -->
    <header>
      <button class="logo" id="homeBtn" aria-label="CyberSafe Campus">
        <svg width="38" height="38" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2 4 6v9c0 7.5 5 13 12 15 7-2 12-7.5 12-15V6z" fill="#0C4966"/>
          <rect x="11" y="14" width="10" height="8" rx="1.5" fill="#F4AF00"/>
          <path d="M13 14v-2.5a3 3 0 0 1 6 0V14" fill="none" stroke="#E67016" stroke-width="2"/>
        </svg>
        <span class="brand"><b>CyberSafe Campus</b><small id="tag">Protege tu vida digital</small></span>
      </button>
      <button class="btn sm" id="langBtn">EN</button>
    </header>

    <!-- Menú de navegación: lo genera js/app.js (Inicio, Módulos 1-5 y Créditos) -->
    <nav id="menu"></nav>

    <!-- Barra de progreso: js/app.js ajusta su ancho según la pantalla -->
    <div class="progress"><div id="bar"></div></div>
  </div>

  <!-- Contenedor principal: js/app.js dibuja aquí cada pantalla -->
  <main id="app"></main>

  <!-- Pie de página (lo genera js/app.js, con enlace a Créditos) -->
  <footer id="foot"></footer>

  <!-- Lógica y contenido bilingüe de la aplicación -->
  <script src="js/app.js"></script>
</body>
</html>
